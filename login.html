<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Nhất Thái</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card login-card shadow-sm w-100">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="h3 mb-2">Đăng nhập</h1>
          <p class="text-secondary mb-0">Chào mừng bạn quay lại Nhất Thái</p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Tên tài khoản</label>
            <input id="username" name="username" class="form-control" type="text"
              placeholder="Nhập tên tài khoản" autocomplete="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input id="password" name="password" class="form-control" type="password"
              placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          </div>

          <div class="form-check mb-4">
            <input id="showPassword" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="showPassword">Hiển thị mật khẩu</label>
          </div>

          <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
          <p id="loginMessage" class="small text-secondary text-center mt-3 mb-0" aria-live="polite"></p>
        </form>

        <div class="text-center mt-4">
          <span class="text-secondary">Chưa có tài khoản?</span>
          <a href="dk.html" class="link-primary text-decoration-none">Đăng ký</a>
        </div>
      </div>
    </div>
  </main>
  <script src="login.js"></script>
</body>

</html>
