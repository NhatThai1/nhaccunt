<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký | Nhất Thái</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/dk.css">
</head>

<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card register-card shadow-sm w-100">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="h3 mb-2">Tạo tài khoản</h1>
          <p class="text-secondary mb-0">Đăng ký tài khoản Nhất Thái</p>
        </div>

        <form id="registerForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" class="form-control" type="email"
              placeholder="name@example.com" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Số điện thoại</label>
            <input id="phone" name="phone" class="form-control" type="tel"
              placeholder="Nhập số điện thoại" autocomplete="tel" required>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Tên tài khoản</label>
            <input id="username" name="username" class="form-control" type="text"
              placeholder="Chọn tên tài khoản" autocomplete="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input id="password" name="password" class="form-control" type="password"
              placeholder="Ít nhất 8 ký tự" autocomplete="new-password" minlength="8" required>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
            <input id="confirmPassword" name="confirmPassword" class="form-control" type="password"
              placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
          </div>

          <div class="form-check mb-4">
            <input id="showPassword" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="showPassword">Hiển thị mật khẩu</label>
          </div>

          <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
          <p id="registerMessage" class="small text-secondary text-center mt-3 mb-0" aria-live="polite"></p>
        </form>

        <div class="text-center mt-4">
          <span class="text-secondary">Đã có tài khoản?</span>
          <a href="login.html" class="link-primary text-decoration-none">Đăng nhập</a>
        </div>
      </div>
    </div>
  </main>
  <script src="dk.js"></script>
</body>

</html>
